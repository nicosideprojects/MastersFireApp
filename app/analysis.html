<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Mode - Coverage Planning</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            font-family: sans-serif;
        }

        #panel {
            width: 300px;
            min-width: 300px;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1000;
            overflow-y: auto;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #555;
            text-decoration: none;
            margin-bottom: -6px;
        }

        .nav-link:hover {
            color: #aaa;
        }

        h2 {
            font-size: 15px;
            color: #4fc3f7;
        }

        .section-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            background: #2d2d44;
            border-radius: 6px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            user-select: none;
        }

        .toggle-row:hover {
            background: #363650;
        }

        .toggle-row .toggle-icon {
            font-size: 15px;
            color: #555;
        }

        .toggle-row.active .toggle-icon {
            color: #4fc3f7;
        }

        .toggle-row .layer-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .toggle-row-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .run-btn {
            width: 100%;
            padding: 11px;
            border-radius: 8px;
            border: 2px solid #4fc3f7;
            background: transparent;
            color: #4fc3f7;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s;
        }

        .run-btn:hover {
            background: #1a2a3d;
        }

        #status {
            font-size: 12px;
            color: #555;
            padding-top: 10px;
            border-top: 1px solid #2d2d44;
            margin-top: auto;
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        .legend {
            background: #1a1a2ecc;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 11px;
            color: #ccc;
            line-height: 1.8;
        }

        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <div id="panel">
        <a class="nav-link" href="home.html">
            <i class="ph ph-bold ph-arrow-left" style="font-size:12px;"></i> Home
        </a>
        <h2>Analysis Mode</h2>
        <p style="font-size:12px;color:#666;margin-top:-6px;">Hydrant coverage visualisation</p>

        <div>
            <div class="section-label">Layers</div>
            <div style="display:flex;flex-direction:column;gap:5px;">
                <div class="toggle-row active" id="toggle-hydrants">
                    <div class="toggle-row-left">
                        <span class="layer-dot" style="background:#4caf50;"></span>Hydrant locations
                    </div>
                    <i class="ph ph-bold ph-eye toggle-icon"></i>
                </div>
                <div class="toggle-row" id="toggle-coverage">
                    <div class="toggle-row-left">
                        <span class="layer-dot" style="background:#4caf5066;border:1.5px solid #4caf50;"></span>Coverage
                        circles (120m)
                    </div>
                    <i class="ph ph-bold ph-eye-slash toggle-icon"></i>
                </div>
                <div class="toggle-row" id="toggle-heatmap">
                    <div class="toggle-row-left">
                        <span class="layer-dot"
                            style="background:linear-gradient(135deg,#ff6b6b,#ff8c00);"></span>Density heatmap
                    </div>
                    <i class="ph ph-bold ph-eye-slash toggle-icon"></i>
                </div>
            </div>
        </div>

        <button class="run-btn" id="run-btn">
            <i class="ph ph-bold ph-play"></i> Run Analysis
        </button>

        <div id="status">Loading hydrant data...</div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([51.5, -0.1], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = () => {
            const legendDiv = L.DomUtil.create('div', 'legend');
            legendDiv.innerHTML = `
            <b style="color:#4fc3f7;font-size:12px;">Analysis Mode</b><br>
            <span class="legend-dot" style="background:#4caf50"></span>Hydrant<br>
            <span class="legend-dot" style="background:#4caf5055;border:1px solid #4caf50"></span>120m coverage
        `;
            return legendDiv;
        };
        legend.addTo(map);

        document.querySelectorAll('.toggle-row').forEach(row => {
            row.addEventListener('click', () => {
                row.classList.toggle('active');
                const icon = row.querySelector('.toggle-icon');
                icon.classList.toggle('ph-eye');
                icon.classList.toggle('ph-eye-slash');
            });
        });

        document.getElementById('run-btn').addEventListener('click', () => {
            document.getElementById('status').textContent = 'Analysis coming soon.';
        });
    </script>
</body>

</html>

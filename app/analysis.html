<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Mode - Coverage Planning</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            font-family: sans-serif;
        }

        #panel {
            width: 300px;
            min-width: 300px;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1000;
            overflow-y: auto;
        }

        .nav-link {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 11px;
            color: #555;
            text-decoration: none;
            margin-bottom: -6px;
        }

        .nav-link:hover {
            color: #aaa;
        }

        h2 {
            font-size: 15px;
            color: #4fc3f7;
        }

        .section-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            background: #2d2d44;
            border-radius: 6px;
            font-size: 13px;
            color: #ccc;
            cursor: pointer;
            user-select: none;
        }

        .toggle-row:hover {
            background: #363650;
        }

        .toggle-row .toggle-icon {
            font-size: 15px;
            color: #555;
        }

        .toggle-row.active .toggle-icon {
            color: #4fc3f7;
        }

        .toggle-row .layer-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex-shrink: 0;
        }

        .toggle-row-left {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        #status {
            font-size: 12px;
            color: #555;
            padding-top: 10px;
            border-top: 1px solid #2d2d44;
            margin-top: auto;
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        .legend {
            background: #1a1a2ecc;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 11px;
            color: #ccc;
            line-height: 1.8;
        }

        .legend-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }
    </style>
</head>

<body>

    <div id="panel">
        <a class="nav-link" href="home.html">
            <i class="ph ph-bold ph-arrow-left" style="font-size:12px;"></i> Home
        </a>
        <h2>Analysis Mode</h2>
        <p style="font-size:12px;color:#666;margin-top:-6px;">Hydrant coverage visualisation</p>

        <div>
            <div class="section-label">Search location</div>
            <div style="display:flex;gap:6px;">
                <input id="search-input" type="text" placeholder="Search a place..."
                    style="flex:1;padding:7px 10px;border-radius:6px;border:1px solid #444;background:#2d2d44;color:#eee;font-size:13px;outline:none;" />
                <button id="search-btn"
                    style="padding:7px 12px;border-radius:6px;border:1px solid #444;background:#2d2d44;color:#aaa;font-size:13px;cursor:pointer;white-space:nowrap;">Go</button>
            </div>
        </div>

        <div>
            <div class="section-label">Layers</div>
            <div style="display:flex;flex-direction:column;gap:5px;">
                <div class="toggle-row active" id="toggle-hydrants">
                    <div class="toggle-row-left">
                        <span class="layer-dot" style="background:#4caf50;"></span>Hydrant locations
                    </div>
                    <i class="ph ph-bold ph-eye toggle-icon"></i>
                </div>
                <div class="toggle-row" id="toggle-coverage">
                    <div class="toggle-row-left">
                        <span class="layer-dot" style="background:#4caf5066;border:1.5px solid #4caf50;"></span>Coverage
                        circles (120m)
                    </div>
                    <i class="ph ph-bold ph-eye-slash toggle-icon"></i>
                </div>
                <div class="toggle-row" id="toggle-heatmap">
                    <div class="toggle-row-left">
                        <span class="layer-dot"
                            style="background:linear-gradient(135deg,#ff6b6b,#ff8c00);"></span>Density heatmap
                    </div>
                    <i class="ph ph-bold ph-eye-slash toggle-icon"></i>
                </div>
            </div>
        </div>

        <div id="status">Loading hydrant data...</div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([51.5, -0.1], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        const status = document.getElementById('status');

        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = () => {
            const legendDiv = L.DomUtil.create('div', 'legend');
            legendDiv.innerHTML = `
            <b style="color:#4fc3f7;font-size:12px;">Analysis Mode</b><br>
            <span class="legend-dot" style="background:#4caf50"></span>Hydrant<br>
            <span class="legend-dot" style="background:#4caf5055;border:1px solid #4caf50"></span>120m coverage
        `;
            return legendDiv;
        };
        legend.addTo(map);

        let hydrants = [];
        let hydrantLayer = L.layerGroup().addTo(map);
        let coverageLayer = L.layerGroup();
        let heatLayer = null;

        const layerByToggleId = {
            'toggle-hydrants': hydrantLayer,
            'toggle-coverage': coverageLayer
        };

        // load the hydrant dataset the coverage layers are built from
        fetch('data/london_hydrants.geojson')
            .then(response => response.json())
            .then(data => {
                hydrants = data.features;
                renderHydrantDots();
                status.textContent = `${hydrants.length} hydrants loaded`;
            })
            .catch(() => {
                status.textContent = 'Error loading hydrant data - open via Live Server';
                status.style.color = '#ff6b6b';
            });

        // draws a small dot for every hydrant
        function renderHydrantDots() {
            hydrantLayer.clearLayers();
            hydrants.forEach(hydrant => {
                const [hydrantLon, hydrantLat] = hydrant.geometry.coordinates;
                L.circleMarker([hydrantLat, hydrantLon], {
                    radius: 3, color: '#4caf50', fillColor: '#4caf50',
                    fillOpacity: 0.8, weight: 1
                }).addTo(hydrantLayer);
            });
        }

        // draws a service-radius circle around every hydrant
        function renderCoverageCircles(radiusM) {
            coverageLayer.clearLayers();
            hydrants.forEach(hydrant => {
                const [hydrantLon, hydrantLat] = hydrant.geometry.coordinates;
                L.circle([hydrantLat, hydrantLon], {
                    radius: radiusM,
                    color: '#4caf50', fillColor: '#4caf50',
                    fillOpacity: 0.06, weight: 0.5, opacity: 0.4
                }).addTo(coverageLayer);
            });
        }

        // builds a density heatmap from the hydrant locations
        function renderHeatmap() {
            if (heatLayer) map.removeLayer(heatLayer);
            const heatPoints = hydrants.map(hydrant => {
                const [hydrantLon, hydrantLat] = hydrant.geometry.coordinates;
                return [hydrantLat, hydrantLon, 0.6];
            });
            heatLayer = L.heatLayer(heatPoints, { radius: 30, blur: 20, maxZoom: 17, max: 1 });
            if (document.getElementById('toggle-heatmap').classList.contains('active')) {
                heatLayer.addTo(map);
            }
        }

        // shows or hides one of the toggleable map layers and updates its icon
        function setLayerVisible(toggleId, visible) {
            const toggleBtn = document.getElementById(toggleId);
            const icon = toggleBtn.querySelector('.toggle-icon');
            if (visible) {
                toggleBtn.classList.add('active');
                icon.classList.replace('ph-eye-slash', 'ph-eye');
                map.addLayer(layerByToggleId[toggleId]);
            } else {
                toggleBtn.classList.remove('active');
                icon.classList.replace('ph-eye', 'ph-eye-slash');
                map.removeLayer(layerByToggleId[toggleId]);
            }
        }

        Object.keys(layerByToggleId).forEach(toggleId => {
            document.getElementById(toggleId).addEventListener('click', () => {
                const visible = !document.getElementById(toggleId).classList.contains('active');
                if (toggleId === 'toggle-coverage' && visible && coverageLayer.getLayers().length === 0) {
                    renderCoverageCircles(120);
                }
                setLayerVisible(toggleId, visible);
            });
        });

        document.getElementById('toggle-heatmap').addEventListener('click', () => {
            const visible = !document.getElementById('toggle-heatmap').classList.contains('active');
            if (visible && !heatLayer) renderHeatmap();
            const toggleBtn = document.getElementById('toggle-heatmap');
            const icon = toggleBtn.querySelector('.toggle-icon');
            if (visible) {
                toggleBtn.classList.add('active');
                icon.classList.replace('ph-eye-slash', 'ph-eye');
                if (heatLayer) heatLayer.addTo(map);
            } else {
                toggleBtn.classList.remove('active');
                icon.classList.replace('ph-eye', 'ph-eye-slash');
                if (heatLayer) map.removeLayer(heatLayer);
            }
        });

        // looks up a place name via openstreetmap and pans/zooms the map to it
        async function searchAndGo() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            const searchBtn = document.getElementById('search-btn');
            searchBtn.textContent = '...';
            searchBtn.disabled = true;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
                const results = await response.json();
                if (!results.length) { status.textContent = `No results for "${query}"`; return; }
                const [minLat, maxLat, minLon, maxLon] = results[0].boundingbox.map(Number);
                map.fitBounds([[minLat, minLon], [maxLat, maxLon]]);
            } catch {
                status.textContent = 'Search failed - check connection';
                status.style.color = '#ff6b6b';
            } finally {
                searchBtn.textContent = 'Go';
                searchBtn.disabled = false;
            }
        }

        document.getElementById('search-btn').addEventListener('click', searchAndGo);
        document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') searchAndGo(); });
    </script>
</body>

</html>

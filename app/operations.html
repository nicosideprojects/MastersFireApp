<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Response Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            font-family: sans-serif;
        }

        #panel {
            width: 300px;
            min-width: 300px;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1000;
            overflow-y: auto;
        }

        h2 {
            font-size: 15px;
            color: #ff6b6b;
        }

        .section-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .pin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .pin-btn {
            padding: 10px 8px;
            border-radius: 8px;
            border: 2px solid #2d2d44;
            background: #2d2d44;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }

        .pin-btn:hover {
            border-color: #555;
            color: #fff;
        }

        .pin-btn.active {
            border-color: #ff6b6b;
            color: #fff;
            background: #3d2232;
        }

        .pin-btn .emoji {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }

        #info {
            background: #2d2d44;
            border-radius: 8px;
            padding: 14px;
            font-size: 13px;
            min-height: 100px;
        }

        .info-muted {
            color: #666;
            font-size: 13px;
            font-style: italic;
        }

        #map {
            flex: 1;
            height: 100vh;
        }
    </style>
</head>

<body>

    <div id="panel">
        <a href="home.html"
            style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#555;text-decoration:none;margin-bottom:-6px;"
            onmouseover="this.style.color='#aaa'" onmouseout="this.style.color='#555'">
            <i class="ph ph-bold ph-arrow-left" style="font-size:12px;"></i> Home
        </a>
        <h2>Emergency Response Tool</h2>

        <div>
            <div class="section-label">Select pin type</div>
            <div class="pin-grid">
                <button class="pin-btn active" data-mode="fire"><span class="emoji">🔥</span>Fire</button>
            </div>
        </div>

        <div>
            <div class="section-label">Details</div>
            <div id="info"><span class="info-muted">Click the map to place a fire...</span></div>
        </div>
    </div>

    <div id="map"></div>

    <script>
        const map = L.map('map').setView([51.5, -0.1], 13);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        let currentMode = 'fire';
        const info = document.getElementById('info');

        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pin-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });

        function makeIcon(emoji) {
            return L.divIcon({
                html: `<div style="font-size:26px;line-height:1;filter:drop-shadow(1px 1px 3px rgba(0,0,0,0.6))">${emoji}</div>`,
                className: '', iconSize: [30, 30], iconAnchor: [15, 15]
            });
        }

        map.on('click', (e) => {
            const { lat, lng } = e.latlng;
            L.marker([lat, lng], { icon: makeIcon('🔥') }).addTo(map);
            info.innerHTML = '<span class="info-muted">Pin placed - calcs TODO</span>';
        });
    </script>
</body>

</html>

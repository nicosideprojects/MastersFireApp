<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergency Response Tool</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="config.js"></script>
    <script src="geo-utils.js"></script>
    <script src="api-status.js"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            height: 100vh;
            font-family: sans-serif;
        }

        #panel {
            width: 300px;
            min-width: 300px;
            background: #1a1a2e;
            color: #eee;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 1000;
            overflow-y: auto;
        }

        h2 {
            font-size: 15px;
            color: #ff6b6b;
        }

        .section-label {
            font-size: 11px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }

        .pin-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .pin-btn {
            padding: 10px 8px;
            border-radius: 8px;
            border: 2px solid #2d2d44;
            background: #2d2d44;
            color: #ccc;
            font-size: 13px;
            cursor: pointer;
            text-align: center;
            transition: all 0.15s;
        }

        .pin-btn:hover {
            border-color: #555;
            color: #fff;
        }

        .pin-btn.active {
            border-color: #ff6b6b;
            color: #fff;
            background: #3d2232;
        }

        .pin-btn .emoji {
            font-size: 20px;
            display: block;
            margin-bottom: 3px;
        }

        #pin-list-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            min-height: 36px;
        }

        .pin-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #2d2d44;
            border-radius: 6px;
            padding: 7px 10px;
            font-size: 13px;
            cursor: pointer;
        }

        .pin-item:hover {
            background: #363650;
        }

        .pin-item.selected {
            outline: 1px solid #ff6b6b;
        }

        .pin-item-emoji {
            font-size: 16px;
            flex-shrink: 0;
        }

        .pin-item-label {
            flex: 1;
            color: #ddd;
        }

        .pin-delete {
            background: none;
            border: none;
            color: #555;
            font-size: 18px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
            flex-shrink: 0;
        }

        .pin-delete:hover {
            color: #ff6b6b;
        }

        .pin-list-empty {
            color: #555;
            font-size: 12px;
            font-style: italic;
        }

        #info {
            background: #2d2d44;
            border-radius: 8px;
            padding: 14px;
            font-size: 13px;
            min-height: 100px;
        }

        .info-row {
            margin-bottom: 9px;
        }

        .info-row:last-child {
            margin-bottom: 0;
        }

        .info-label {
            color: #888;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .info-value {
            color: #fff;
            font-size: 14px;
            font-weight: 600;
        }

        .info-sub {
            color: #aaa;
            font-size: 12px;
        }

        .info-muted {
            color: #666;
            font-size: 13px;
            font-style: italic;
        }

        #clear-btn {
            padding: 9px;
            border-radius: 6px;
            border: 1px solid #444;
            background: transparent;
            color: #aaa;
            font-size: 13px;
            cursor: pointer;
        }

        #clear-btn:hover {
            background: #2d2d44;
            color: #fff;
        }

        #status {
            font-size: 12px;
            color: #555;
            padding-top: 10px;
            border-top: 1px solid #2d2d44;
        }

        .api-log {
            display: flex;
            flex-direction: column;
            gap: 4px;
            max-height: 130px;
            overflow-y: auto;
            padding-top: 10px;
            border-top: 1px solid #2d2d44;
        }

        .api-log-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            color: #888;
        }

        .api-log-row .ph-check-circle {
            color: #4caf50;
        }

        .api-log-row .ph-x-circle {
            color: #ff6b6b;
        }

        .api-log-row .spin {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        #map {
            flex: 1;
            height: 100vh;
        }

        #pin-fetch-indicator {
            display: none;
            position: fixed;
            right: 16px;
            bottom: 16px;
            background: #1a1a2ee6;
            color: #ccc;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 12px;
            z-index: 2000;
        }
    </style>
</head>

<body>

    <div id="panel">
        <a href="home.html"
            style="display:inline-flex;align-items:center;gap:5px;font-size:11px;color:#555;text-decoration:none;margin-bottom:-6px;"
            onmouseover="this.style.color='#aaa'" onmouseout="this.style.color='#555'">
            <i class="ph ph-bold ph-arrow-left" style="font-size:12px;"></i> Home
        </a>
        <h2>Emergency Response Tool</h2>

        <div>
            <div class="section-label">Select pin type</div>
            <div class="pin-grid">
                <button class="pin-btn active" data-mode="fire"><span class="emoji">🔥</span>Fire</button>
                <button class="pin-btn" data-mode="truck"><span class="emoji">🚒</span>Fire Truck</button>
                <button class="pin-btn" data-mode="person"><span class="emoji">🤕</span>Injured Person</button>
                <button class="pin-btn" data-mode="plane"><span class="emoji">✈️</span>Aerial</button>
            </div>
        </div>

        <div>
            <div class="section-label">Live data</div>
            <div style="display:flex;gap:6px;margin-bottom:8px;">
                <input id="search-input" type="text" placeholder="Search a place..."
                    style="flex:1;padding:7px 10px;border-radius:6px;border:1px solid #444;background:#2d2d44;color:#eee;font-size:13px;outline:none;" />
                <button id="search-btn"
                    style="padding:7px 12px;border-radius:6px;border:1px solid #444;background:#2d2d44;color:#aaa;font-size:13px;cursor:pointer;white-space:nowrap;">Go</button>
            </div>
            <button id="fetch-btn"
                style="width:100%;padding:9px;border-radius:6px;border:1px solid #444;background:#2d2d44;color:#aaa;font-size:13px;cursor:pointer;">Fetch
                data for this area</button>
            <button id="use-static-btn"
                style="display:none;width:100%;margin-top:6px;padding:9px;border-radius:6px;border:1px solid #444;background:transparent;color:#aaa;font-size:13px;cursor:pointer;">Use
                static instead</button>
        </div>

        <div>
            <div class="section-label">Placed pins</div>
            <div id="pin-list-container">
                <div class="pin-list-empty">No pins placed yet</div>
            </div>
        </div>

        <div>
            <div class="section-label">Details</div>
            <div id="info"><span class="info-muted">Select a pin type and click the map...</span></div>
        </div>

        <button id="clear-btn">Clear all pins</button>

        <div id="status">Loading data...</div>

        <div style="margin-top:auto;">
            <div class="section-label">API Calls</div>
            <div id="api-log" class="api-log"></div>
        </div>
    </div>

    <div id="map"></div>
    <div id="pin-fetch-indicator"></div>

    <script>
        const map = L.map('map').setView([51.5, -0.1], 13);

        L.tileLayer(`https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=${CARTO_KEY}`, {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>'
        }).addTo(map);

        let hydrants = [], waterBodies = [], hospitals = [];
        // true once any fetch has finished separated from nothing found
        let areaDataLoaded = false;
        let backgroundFetchInFlight = false;
        let pins = [];
        let pinIdCounter = 0;
        let currentMode = 'fire';
        let selectedPinId = null;

        const info = document.getElementById('info');
        const status = document.getElementById('status');
        const pinListContainer = document.getElementById('pin-list-container');

        const PIN_EMOJIS = { fire: '🔥', truck: '🚒', person: '🤕', plane: '✈️' };
        const PIN_LABELS = { fire: 'Fire', truck: 'Truck', person: 'Injured Person', plane: 'Aerial' };

        document.querySelectorAll('.pin-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.pin-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentMode = btn.dataset.mode;
            });
        });

        document.getElementById('clear-btn').addEventListener('click', () => {
            [...pins].forEach(pin => removePin(pin.id));
            info.innerHTML = '<span class="info-muted">Cleared. Click the map to place a pin.</span>';
        });

        // load the static datasets needed for the fire, person, and aerial pins
        function loadStaticData() {
            status.style.color = '';
            status.textContent = 'Loading static data...';
            const cities = ['london', 'berlin'];
            const datasets = ['hydrants', 'water', 'hospitals'];
            Promise.all(
                cities.flatMap(city => datasets.map(dataset =>
                    fetch(`data/${city}_${dataset}.geojson`).then(response => response.json())
                ))
            ).then(results => {
                hydrants = [];
                waterBodies = [];
                hospitals = [];
                cities.forEach((city, cityIdx) => {
                    const [hydrantData, waterData, hospitalData] = results.slice(cityIdx * datasets.length, cityIdx * datasets.length + datasets.length);
                    hydrants.push(...hydrantData.features);
                    waterBodies.push(...waterData.features);
                    hospitals.push(...hospitalData.features);
                });
                areaDataLoaded = true;
                status.textContent = `${hydrants.length} hydrants, ${waterBodies.length} water sources, ${hospitals.length} hospitals (static, London + Berlin)`;
            }).catch(() => {
                status.textContent = 'Error loading static files - open via Live Server';
                status.style.color = '#ff6b6b';
            });
        }

        // redraws the API call log whenever it changes
        function renderApiLog(calls) {
            const el = document.getElementById('api-log');
            if (!calls.length) {
                el.innerHTML = '<div class="api-log-row">No API calls yet</div>';
                return;
            }
            el.innerHTML = calls.map(call => {
                const icon = call.status === 'pending' ? '<i class="ph ph-bold ph-circle-notch spin"></i>'
                    : call.status === 'success' ? '<i class="ph ph-bold ph-check-circle"></i>'
                        : '<i class="ph ph-bold ph-x-circle"></i>';
                const durationMs = call.endedAt ? call.endedAt - call.startedAt : null;
                const suffix = durationMs !== null ? ` (${durationMs}ms)` : '';
                const detail = call.status === 'failed' && call.detail ? ` - ${call.detail}` : '';
                return `<div class="api-log-row">${icon} ${call.name}${suffix}${detail}</div>`;
            }).join('');
        }
        onApiCallsChange(renderApiLog);
        renderApiLog(getApiCalls());

        // several public Overpass mirrors, in case one is down or rate-limiting
        const OVERPASS_MIRRORS = [
            'https://overpass-api.de/api/interpreter',
            'https://lz4.overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter'
        ];
        const CACHE_TTL_MS = 24 * 60 * 60 * 1000;
        let stickyMirror = null;

        // reads a cached Overpass response from localStorage if it hasn't expired
        function cacheGet(key) {
            try {
                const rawCached = localStorage.getItem(key);
                if (!rawCached) return null;
                const { ts, data } = JSON.parse(rawCached);
                if (Date.now() - ts > CACHE_TTL_MS) { localStorage.removeItem(key); return null; }
                return data;
            } catch { return null; }
        }

        // writes an Overpass response to localStorage with a timestamp
        function cacheSet(key, data) {
            try { localStorage.setItem(key, JSON.stringify({ ts: Date.now(), data })); } catch { }
        }

        // sends a query to the first working Overpass mirror, remembering which one worked
        async function overpassFetch(query, abortSignal) {
            const orderedMirrors = stickyMirror
                ? [stickyMirror, ...OVERPASS_MIRRORS.filter(mirror => mirror !== stickyMirror)]
                : OVERPASS_MIRRORS;

            for (const mirrorUrl of orderedMirrors) {
                try {
                    const response = await fetch(mirrorUrl, {
                        method: 'POST',
                        body: 'data=' + encodeURIComponent(query),
                        signal: abortSignal
                    });
                    if (!response.ok) continue;
                    const json = await response.json();
                    stickyMirror = mirrorUrl;
                    return json;
                } catch (err) {
                    if (err.name === 'AbortError') throw err;
                }
            }
            throw new Error('All Overpass mirrors failed');
        }

        // converts raw Overpass elements into the same feature shape as the static geojson files
        function overpassToFeatures(elements) {
            return elements.flatMap(element => {
                let lat, lon;
                if (element.type === 'node') { lat = element.lat; lon = element.lon; }
                else if (element.center) { lat = element.center.lat; lon = element.center.lon; }
                else return [];
                return [{ geometry: { coordinates: [lon, lat] }, properties: element.tags || {} }];
            });
        }

        // formats map bounds as a south,west,north,east string for an Overpass bbox filter
        function boundsToStr(bounds) {
            const round = value => value.toFixed(2);
            return `${round(bounds.getSouth())},${round(bounds.getWest())},${round(bounds.getNorth())},${round(bounds.getEast())}`;
        }

        // fetches one Overpass layer, using the cache first if available
        async function loadLayer(cacheKey, query, abortSignal) {
            const cached = cacheGet(cacheKey);
            if (cached) return { features: cached, fromCache: true };
            const json = await overpassFetch(query, abortSignal);
            const features = overpassToFeatures(json.elements);
            cacheSet(cacheKey, features);
            return { features, fromCache: false };
        }

        // estimates the area of a bounding box in square kilometres
        function bboxAreaKm2(bounds) {
            const deltaLat = bounds.getNorth() - bounds.getSouth();
            const deltaLon = bounds.getEast() - bounds.getWest();
            return deltaLat * 111 * deltaLon * 111 * Math.cos(bounds.getCenter().lat * Math.PI / 180);
        }

        const FORCE_STATIC_MODE = false;
        const LIVE_FETCH_TIMEOUT_MS = 20000;
        const LIVE_DEDUP_DISTANCE_KM = 0.015;
        const PIN_FETCH_RADIUS_KM = 3;

        // the combined hydrant/water/hospital Overpass query for a given bbox string
        function buildAreaQuery(boundingBoxStr) {
            return `[out:json][timeout:25];(
                nwr["emergency"="fire_hydrant"](${boundingBoxStr});
                nwr["natural"="water"](${boundingBoxStr});
                nwr["landuse"="reservoir"](${boundingBoxStr});
                nwr["leisure"="swimming_pool"](${boundingBoxStr});
                nwr["amenity"="hospital"](${boundingBoxStr});
                nwr["amenity"="clinic"](${boundingBoxStr});
            );out center;`;
        }

        // fetches hydrants, water sources, and hospitals for the current map area via Overpass
        async function fetchAreaData(bounds) {
            const fetchBtn = document.getElementById('fetch-btn');
            const useStaticBtn = document.getElementById('use-static-btn');
            status.style.color = '';

            if (FORCE_STATIC_MODE) {
                status.textContent = 'Live fetch disabled (testing mode) - using static data';
                return;
            }

            const areaKm2 = bboxAreaKm2(bounds);
            if (areaKm2 > 150) {
                status.textContent = `Area too large (~${Math.round(areaKm2)} km2) - zoom in and try again`;
                status.style.color = '#ffb347';
                return;
            }

            fetchBtn.disabled = true;
            fetchBtn.textContent = 'Fetching...';
            useStaticBtn.style.display = 'block';

            const abortController = new AbortController();
            let userCancelled = false;
            useStaticBtn.onclick = () => { userCancelled = true; abortController.abort(); };
            const timeoutId = setTimeout(() => abortController.abort(), LIVE_FETCH_TIMEOUT_MS);

            try {
                const boundingBoxStr = boundsToStr(bounds);
                const cacheKeySuffix = boundingBoxStr.replace(/,/g, '_');

                status.textContent = `Finding Overpass mirror... (~${Math.round(areaKm2)} km2)`;
                // had to combine the reqests due to the repeated 429 responses from the api
                // v2 to avoid a stale cache from before this
                const result = await trackApiCall('Fetch area data',
                    () => loadLayer(`osm_area_v2_${cacheKeySuffix}`, buildAreaQuery(boundingBoxStr), abortController.signal));

                const fetchedHydrants = [], fetchedWater = [], fetchedHospitals = [];
                result.features.forEach(feature => {
                    const kind = classifyLiveFeature(feature.properties);
                    if (kind === 'hydrant') fetchedHydrants.push(feature);
                    else if (kind === 'water') fetchedWater.push(feature);
                    else if (kind === 'hospital') fetchedHospitals.push(feature);
                });

                // merged onto existing data instead of replacing it
                hydrants = mergeUniqueFeatures(hydrants, fetchedHydrants, LIVE_DEDUP_DISTANCE_KM);
                waterBodies = mergeUniqueFeatures(waterBodies, fetchedWater, LIVE_DEDUP_DISTANCE_KM);
                hospitals = mergeUniqueFeatures(hospitals, fetchedHospitals, LIVE_DEDUP_DISTANCE_KM);

                areaDataLoaded = true;
                status.textContent = `Fetched ${fetchedHydrants.length} hydrants, ${fetchedWater.length} water sources, ${fetchedHospitals.length} hospitals for this area (${hydrants.length}/${waterBodies.length}/${hospitals.length} total loaded)${result.fromCache ? ' (cached)' : ''}`;
            } catch (err) {
                status.style.color = err.name === 'AbortError' ? '#ffb347' : '#ff6b6b';
                if (err.name === 'AbortError') {
                    status.textContent = userCancelled
                        ? 'Cancelled - using static data'
                        : `Live fetch timed out after ${LIVE_FETCH_TIMEOUT_MS / 1000}s - using static data`;
                } else if (err.message.includes('429')) {
                    status.textContent = 'Rate limited by Overpass - wait a moment and try again';
                } else if (err.message.includes('504') || err.message.includes('502')) {
                    status.textContent = 'Overpass timeout - zoom in further and try again';
                } else {
                    status.textContent = 'Fetch failed - check connection';
                }
            } finally {
                clearTimeout(timeoutId);
                useStaticBtn.style.display = 'none';
                useStaticBtn.onclick = null;
                fetchBtn.disabled = false;
                fetchBtn.textContent = 'Fetch data for this area';
            }
        }

        const pinFetchIndicator = document.getElementById('pin-fetch-indicator');

        // true if this pin type is missing its relevant data within PIN_FETCH_RADIUS_KM
        function needsAreaFetch(pin) {
            if (pin.type === 'fire') {
                return !isCovered(pin.lat, pin.lng, PIN_FETCH_RADIUS_KM, hydrants)
                    || !isCovered(pin.lat, pin.lng, PIN_FETCH_RADIUS_KM, waterBodies);
            }
            if (pin.type === 'plane') return !isCovered(pin.lat, pin.lng, PIN_FETCH_RADIUS_KM, waterBodies);
            if (pin.type === 'person') return !isCovered(pin.lat, pin.lng, PIN_FETCH_RADIUS_KM, hospitals);
            return false;
        }

        // recalculates every non-truck pin so newly merged data shows up on already-placed pins too
        async function refreshAllPins() {
            for (const p of pins) {
                if (p.type === 'truck') continue;
                p.layers.forEach(layer => map.removeLayer(layer));
                p.layers = [];
                await calculatePin(p);
            }
            const selectedPin = pins.find(p => p.id === selectedPinId);
            if (selectedPin) info.innerHTML = selectedPin.lastInfo;
        }

        // fetches live data around a pin in the background if it has no nearby data yet
        async function maybeFetchAreaAroundPin(pin) {
            if (FORCE_STATIC_MODE || backgroundFetchInFlight || !needsAreaFetch(pin)) return;

            backgroundFetchInFlight = true;
            pinFetchIndicator.textContent = 'Fetching nearby data...';
            pinFetchIndicator.style.display = 'block';

            const abortController = new AbortController();
            const timeoutId = setTimeout(() => abortController.abort(), LIVE_FETCH_TIMEOUT_MS);

            try {
                const bounds = L.latLng(pin.lat, pin.lng).toBounds(PIN_FETCH_RADIUS_KM * 2 * 1000);
                const boundingBoxStr = boundsToStr(bounds);
                const cacheKeySuffix = boundingBoxStr.replace(/,/g, '_');
                const result = await trackApiCall('Fetch data near new pin',
                    () => loadLayer(`osm_area_v2_${cacheKeySuffix}`, buildAreaQuery(boundingBoxStr), abortController.signal));

                const fetchedHydrants = [], fetchedWater = [], fetchedHospitals = [];
                result.features.forEach(feature => {
                    const kind = classifyLiveFeature(feature.properties);
                    if (kind === 'hydrant') fetchedHydrants.push(feature);
                    else if (kind === 'water') fetchedWater.push(feature);
                    else if (kind === 'hospital') fetchedHospitals.push(feature);
                });

                hydrants = mergeUniqueFeatures(hydrants, fetchedHydrants, LIVE_DEDUP_DISTANCE_KM);
                waterBodies = mergeUniqueFeatures(waterBodies, fetchedWater, LIVE_DEDUP_DISTANCE_KM);
                hospitals = mergeUniqueFeatures(hospitals, fetchedHospitals, LIVE_DEDUP_DISTANCE_KM);
                areaDataLoaded = true;

                pinFetchIndicator.textContent = `Loaded ${fetchedHydrants.length} hydrants, ${fetchedWater.length} water, ${fetchedHospitals.length} hospitals nearby`;
                await refreshAllPins();
            } catch {
                pinFetchIndicator.textContent = 'Live data not available nearby';
            } finally {
                clearTimeout(timeoutId);
                backgroundFetchInFlight = false;
                setTimeout(() => { pinFetchIndicator.style.display = 'none'; }, 2500);
            }
        }

        // looks up a place name via openstreetmap and pans/zooms the map to it
        async function searchAndGo() {
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;
            const searchBtn = document.getElementById('search-btn');
            searchBtn.textContent = '...';
            searchBtn.disabled = true;
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1`);
                const results = await response.json();
                if (!results.length) { status.textContent = `No results for "${query}"`; return; }
                const [minLat, maxLat, minLon, maxLon] = results[0].boundingbox.map(Number);
                map.fitBounds([[minLat, minLon], [maxLat, maxLon]]);
            } catch {
                status.textContent = 'Search failed - check connection';
                status.style.color = '#ff6b6b';
            } finally {
                searchBtn.textContent = 'Go';
                searchBtn.disabled = false;
            }
        }

        document.getElementById('fetch-btn').addEventListener('click', () => fetchAreaData(map.getBounds()));
        document.getElementById('search-btn').addEventListener('click', searchAndGo);
        document.getElementById('search-input').addEventListener('keydown', e => { if (e.key === 'Enter') searchAndGo(); });

        loadStaticData();


        // creates a custom Leaflet icon using an emoji
        function makeIcon(emoji) {
            return L.divIcon({
                html: `<div style="font-size:26px;line-height:1;filter:drop-shadow(1px 1px 3px rgba(0,0,0,0.6))">${emoji}</div>`,
                className: '', iconSize: [30, 30], iconAnchor: [15, 15]
            });
        }

        // requests a road-network route between two points via OpenRouteService
        async function orsRoute(fromLat, fromLon, toLat, toLon) {
            const response = await fetch('https://api.openrouteservice.org/v2/directions/driving-car/geojson', {
                method: 'POST',
                headers: { 'Authorization': ORS_KEY, 'Content-Type': 'application/json' },
                body: JSON.stringify({ coordinates: [[fromLon, fromLat], [toLon, toLat]] })
            });
            return response.json();
        }

        const TOMTOM_TRAFFIC_TIMEOUT_MS = 5000;

        // requests a live-traffic route (path and travel time) between two points via TomTom
        async function tomtomRoute(fromLat, fromLon, toLat, toLon) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), TOMTOM_TRAFFIC_TIMEOUT_MS);
            try {
                const url = `https://api.tomtom.com/routing/1/calculateRoute/${fromLat},${fromLon}:${toLat},${toLon}/json?key=${TOMTOM_KEY}&traffic=true`;
                const response = await fetch(url, { signal: controller.signal });
                if (!response.ok) throw new Error(`TomTom ${response.status}`);
                const data = await response.json();
                return parseTomTomRoute(data);
            } finally {
                clearTimeout(timeoutId);
            }
        }

        // logs a TomTom route query and returns null on failure so getRoute falls back to ORS
        async function tryTomtomRoute(fromLat, fromLon, toLat, toLon) {
            try {
                return await trackApiCall('Live traffic route (TomTom)', () => tomtomRoute(fromLat, fromLon, toLat, toLon));
            } catch {
                return null;
            }
        }

        // gets a route between two points with a preference to TomTom results
        async function getRoute(fromLat, fromLon, toLat, toLon) {
            const tomtom = await tryTomtomRoute(fromLat, fromLon, toLat, toLon);
            if (tomtom) return tomtom;

            const orsData = await trackApiCall('Route (ORS)', () => orsRoute(fromLat, fromLon, toLat, toLon));
            const summary = orsData.features[0].properties.summary;
            const coords = orsData.features[0].geometry.coordinates.map(([lon, lat]) => [lat, lon]);
            return { coords, distanceMeters: summary.distance, durationSeconds: summary.duration, delaySeconds: 0, source: 'ors' };
        }

        // removes a pin's marker and layers from the map and the pins array
        function removePin(id) {
            const pin = pins.find(existingPin => existingPin.id === id);
            if (!pin) return;
            if (pin.marker) map.removeLayer(pin.marker);
            pin.layers.forEach(layer => map.removeLayer(layer));
            pins = pins.filter(existingPin => existingPin.id !== id);
            if (selectedPinId === id) {
                selectedPinId = null;
                info.innerHTML = '<span class="info-muted">Pin removed.</span>';
            }
            updatePinList();
        }

        // marks a pin as selected and shows its last calculated info
        function selectPin(id) {
            selectedPinId = id;
            const pin = pins.find(existingPin => existingPin.id === id);
            if (pin && pin.lastInfo) info.innerHTML = pin.lastInfo;
            updatePinList();
        }

        // recreates the placed-pins panel from the current pins array
        function updatePinList() {
            if (pins.length === 0) {
                pinListContainer.innerHTML = '<div class="pin-list-empty">No pins placed yet</div>';
                return;
            }
            pinListContainer.innerHTML = pins.map(pin => `
                <div class="pin-item ${pin.id === selectedPinId ? 'selected' : ''}" data-id="${pin.id}">
                    <span class="pin-item-emoji">${PIN_EMOJIS[pin.type]}</span>
                    <span class="pin-item-label">${pin.label}</span>
                    <button class="pin-delete" data-id="${pin.id}">×</button>
                </div>
            `).join('');

            pinListContainer.querySelectorAll('.pin-item').forEach(el => {
                el.addEventListener('click', (e) => {
                    if (!e.target.classList.contains('pin-delete')) {
                        selectPin(parseInt(el.dataset.id));
                    }
                });
            });
            pinListContainer.querySelectorAll('.pin-delete').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removePin(parseInt(btn.dataset.id));
                });
            });
        }

        // creates a new pin on the map, adds it to the pins array, and makes it draggable
        // person pins are single-instance: placing a new one replaces the last
        function createPin(type, lat, lng) {
            if (type === 'person') {
                const existingPersonPin = pins.find(existingPin => existingPin.type === 'person');
                if (existingPersonPin) removePin(existingPersonPin.id);
            }

            const sameTypeCount = pins.filter(existingPin => existingPin.type === type).length + 1;
            const label = sameTypeCount > 1 ? `${PIN_LABELS[type]} ${sameTypeCount}` : PIN_LABELS[type];

            const pin = { id: pinIdCounter++, type, lat, lng, label, marker: null, layers: [], lastInfo: '' };

            const marker = L.marker([lat, lng], { icon: makeIcon(PIN_EMOJIS[type]), draggable: true }).addTo(map);

            marker.on('dragend', async (e) => {
                const { lat: newLat, lng: newLng } = e.target.getLatLng();
                pin.lat = newLat;
                pin.lng = newLng;
                pin.layers.forEach(layer => map.removeLayer(layer));
                pin.layers = [];
                info.innerHTML = '<span class="info-muted">Recalculating...</span>';
                await calculatePin(pin);
                maybeFetchAreaAroundPin(pin);
            });

            pin.marker = marker;
            pins.push(pin);
            selectedPinId = pin.id;
            return pin;
        }

        // draws the fire pins hydrant/water markers and spread cone, builds info HTML, from calculatePin data
        function renderFirePinResult(pin, lat, lng, { nearestHydrants, nearestHydrantFallback, nearestWaters, nearestWaterFallback, wind }) {
            nearestHydrants.forEach(hydrantMatch => {
                const [hydrantLon, hydrantLat] = hydrantMatch.feature.geometry.coordinates;
                pin.layers.push(L.circleMarker([hydrantLat, hydrantLon], { radius: 9, color: '#00e676', fillColor: '#00e676', fillOpacity: 0.9, weight: 2 }).addTo(map));
                pin.layers.push(L.polyline([[lat, lng], [hydrantLat, hydrantLon]], { color: '#00e676', weight: 2, opacity: 0.7, dashArray: '6,5' }).addTo(map));
            });

            nearestWaters.forEach(waterMatch => {
                const [waterLon, waterLat] = waterMatch.feature.geometry.coordinates;
                pin.layers.push(L.circleMarker([waterLat, waterLon], { radius: 9, color: '#00bcd4', fillColor: '#00bcd4', fillOpacity: 0.9, weight: 2 }).addTo(map));
                pin.layers.push(L.polyline([[lat, lng], [waterLat, waterLon]], { color: '#00bcd4', weight: 2, opacity: 0.7, dashArray: '6,5' }).addTo(map));
            });

            // wind is null if the fetch failed, no spread cone in that case
            let windHtml = '<div class="info-row"><span class="info-muted">Wind data unavailable</span></div>';
            if (wind) {
                const spreadBearing = (wind.direction + 180) % 360;
                const spreadDist = Math.max(0.05, wind.speed * 0.02);
                const windSpeedKmh = wind.speed * 3.6;

                pin.layers.push(L.polygon(
                    [[lat, lng],
                    destinationPoint(lat, lng, (spreadBearing - 30 + 360) % 360, spreadDist),
                    destinationPoint(lat, lng, spreadBearing, spreadDist),
                    destinationPoint(lat, lng, (spreadBearing + 30) % 360, spreadDist)],
                    { color: 'orange', fillColor: 'orange', fillOpacity: 0.25, weight: 2, dashArray: '5,4' }
                ).addTo(map));

                windHtml = `
                <div class="info-row">
                    <div class="info-label">Wind</div>
                    <div class="info-value">${windSpeedKmh.toFixed(1)} km/h from ${bearingToCompass(wind.direction)} (${windDescription(windSpeedKmh)})</div>
                </div>
                <div class="info-row">
                    <div class="info-label">Fire spread direction</div>
                    <div class="info-value">Towards ${bearingToCompass(spreadBearing)}</div>
                </div>`;
            }

            const hydrantSummary = nearestHydrants.length
                ? nearestHydrants.map(hydrantMatch => `<div class="info-sub">Hydrant - ${(hydrantMatch.dist * 1000).toFixed(0)}m</div>`).join('')
                : nearestHydrantFallback
                    ? `<div class="info-sub">Hydrant - ${(nearestHydrantFallback.dist * 1000).toFixed(0)}m (nearest, outside 500m)</div>`
                    : `<div class="info-sub">No hydrants found in the loaded area</div>`;

            const waterSummary = nearestWaters.length
                ? nearestWaters.map(waterMatch => `<div class="info-sub">${waterType(waterMatch.feature.properties)} - ${(waterMatch.dist * 1000).toFixed(0)}m</div>`).join('')
                : nearestWaterFallback
                    ? `<div class="info-sub">${waterType(nearestWaterFallback.feature.properties)} - ${(nearestWaterFallback.dist * 1000).toFixed(0)}m (nearest, outside 500m)</div>`
                    : `<div class="info-sub">No water sources found in the loaded area</div>`;

            pin.lastInfo = `
            <div class="info-row">
                <div class="info-label">Hydrants within 500m</div>
                ${!nearestHydrants.length && nearestHydrantFallback ? '<div class="info-sub" style="color:#888">None - showing nearest</div>' : ''}${hydrantSummary}
            </div>
            <div class="info-row">
                <div class="info-label">Water sources within 500m</div>
                ${!nearestWaters.length && nearestWaterFallback ? '<div class="info-sub" style="color:#888">None - showing nearest</div>' : ''}${waterSummary}
            </div>
            ${windHtml}`;
        }

        // creates the travel time row HTML, labelled with whichever source the route came from
        function travelTimeRow(route) {
            const minutes = Math.round(route.durationSeconds / 60);
            const secs = Math.round(route.durationSeconds % 60);
            const delayNote = route.delaySeconds >= 60 ? ` (+${Math.round(route.delaySeconds / 60)} min delay)` : '';
            const sourceNote = route.source === 'tomtom' ? 'Live traffic (TomTom)' : 'Road-speed estimate - live traffic unavailable';
            return `
            <div class="info-row">
                <div class="info-label">Estimated travel time</div>
                <div class="info-value">${minutes}m ${secs}s${delayNote}</div>
                <div class="info-sub" style="color:#888">${sourceNote}</div>
            </div>`;
        }

        // draws the person pin hospital marker + route line, builds info HTML, from calculatePin data
        function renderPersonPinResult(pin, nearestHospital, route) {
            const [hospitalLon, hospitalLat] = nearestHospital.feature.geometry.coordinates;
            const hospitalName = nearestHospital.feature.properties.name || 'Unnamed hospital';
            pin.layers.push(L.marker([hospitalLat, hospitalLon], { icon: makeIcon('🏥') }).addTo(map));

            pin.layers.push(L.polyline(route.coords, { color: '#ff6b6b', weight: 4, opacity: 0.85 }).addTo(map));
            pin.lastInfo = `
            <div class="info-row">
                <div class="info-label">Nearest hospital</div>
                <div class="info-value">${hospitalName}</div>
            </div>
            <div class="info-row">
                <div class="info-label">Route distance</div>
                <div class="info-value">${(route.distanceMeters / 1000).toFixed(2)} km</div>
            </div>
            ${travelTimeRow(route)}`;
        }

        // draws the truck pin route line and builds the info HTML
        function renderTruckPinResult(pin, route) {
            pin.layers.push(L.polyline(route.coords, { color: 'orange', weight: 5, opacity: 0.85 }).addTo(map));
            pin.lastInfo = `
            <div class="info-row">
                <div class="info-label">Routing to nearest fire</div>
                <div class="info-value">${(route.distanceMeters / 1000).toFixed(2)} km via road</div>
            </div>
            ${travelTimeRow(route)}`;
        }

        // draws the plane pins nearest water source marker + line, builds info HTML
        function renderPlanePinResult(pin, lat, lng, nearestWater) {
            const [waterLon, waterLat] = nearestWater.feature.geometry.coordinates;
            pin.layers.push(L.circleMarker([waterLat, waterLon], { radius: 9, color: '#00bcd4', fillColor: '#00bcd4', fillOpacity: 0.9, weight: 2 }).addTo(map));
            pin.layers.push(L.polyline([[lat, lng], [waterLat, waterLon]], { color: '#00bcd4', weight: 3, dashArray: '10,8', opacity: 0.9 }).addTo(map));
            pin.lastInfo = `
            <div class="info-row">
                <div class="info-label">Nearest water source</div>
                <div class="info-value">${waterType(nearestWater.feature.properties)}</div>
            </div>
            <div class="info-row">
                <div class="info-label">Direct distance</div>
                <div class="info-value">${nearestWater.dist.toFixed(2)} km</div>
            </div>
            <div class="info-row">
                <div class="info-label">Route type</div>
                <div class="info-value">Aerial - straight line</div>
            </div>`;
        }

        // fire pin: nearest hydrants/water within 500m and a wind-driven spread cone
        // truck pin: road-network route to the nearest fire pin
        // person pin: road-network route to the nearest hospital
        // plane pin: nearest water body, straight-line bearing
        async function calculatePin(pin) {
            const { type, lat, lng } = pin;

            const dataMissing = {
                // fire pin renders whatever it has, even if only one of the two loaded
                fire: !areaDataLoaded,
                truck: false,
                person: !hospitals.length,
                plane: !waterBodies.length
            };
            // what each pin type needs, shown only once we know data was actually fetched
            const neededDataLabel = { person: 'hospitals', plane: 'water sources' };
            if (dataMissing[type]) {
                pin.lastInfo = areaDataLoaded
                    ? `<span class="info-muted">No ${neededDataLabel[type]} found in the loaded area.</span>`
                    : '<span class="info-muted">No area data loaded - use "Fetch data for this area" first.</span>';
                info.innerHTML = pin.lastInfo;
                updatePinList();
                return;
            }

            if (type === 'fire') {
                const nearestHydrants = findNearestN(lat, lng, hydrants, 3).filter(hydrantMatch => hydrantMatch.dist <= 0.5);
                const nearestHydrantFallback = nearestHydrants[0] || findNearest(lat, lng, hydrants);
                const nearestWaters = findNearestN(lat, lng, waterBodies, 3).filter(waterMatch => waterMatch.dist <= 0.5);
                const nearestWaterFallback = nearestWaters[0] || findNearest(lat, lng, waterBodies);

                let wind = null;
                try {
                    const windResponse = await trackApiCall('Wind (Open-Meteo)', async () => {
                        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current=wind_speed_10m,wind_direction_10m`);
                        if (!response.ok) throw new Error(`Open-Meteo ${response.status}`);
                        return response.json();
                    });
                    wind = { speed: windResponse.current.wind_speed_10m, direction: windResponse.current.wind_direction_10m };
                } catch {
                    wind = null;
                }

                renderFirePinResult(pin, lat, lng, { nearestHydrants, nearestHydrantFallback, nearestWaters, nearestWaterFallback, wind });

            } else if (type === 'truck') {
                const firePins = pins.filter(existingPin => existingPin.type === 'fire');
                if (!firePins.length) {
                    pin.lastInfo = '<span class="info-muted">Place a fire pin first, then place the truck.</span>';
                    info.innerHTML = pin.lastInfo;
                    updatePinList();
                    return;
                }

                let nearestFire = firePins[0];
                let nearestFireDistance = haversine(lat, lng, firePins[0].lat, firePins[0].lng);
                firePins.forEach(firePin => {
                    const distanceToFire = haversine(lat, lng, firePin.lat, firePin.lng);
                    if (distanceToFire < nearestFireDistance) { nearestFireDistance = distanceToFire; nearestFire = firePin; }
                });

                try {
                    const route = await getRoute(lat, lng, nearestFire.lat, nearestFire.lng);
                    renderTruckPinResult(pin, route);
                } catch {
                    pin.lastInfo = '<span class="info-muted">Routing failed - check ORS key.</span>';
                }

            } else if (type === 'person') {
                const nearestHospital = findNearest(lat, lng, hospitals);
                const [hospitalLon, hospitalLat] = nearestHospital.feature.geometry.coordinates;

                try {
                    const route = await getRoute(lat, lng, hospitalLat, hospitalLon);
                    renderPersonPinResult(pin, nearestHospital, route);
                } catch {
                    pin.lastInfo = '<span class="info-muted">Routing failed - check ORS key.</span>';
                }

            } else if (type === 'plane') {
                const nearestWater = findNearest(lat, lng, waterBodies);
                renderPlanePinResult(pin, lat, lng, nearestWater);
            }

            info.innerHTML = pin.lastInfo;
            updatePinList();
        }

        map.on('click', async (e) => {
            const { lat, lng } = e.latlng;
            info.innerHTML = '<span class="info-muted">Working...</span>';
            const pin = createPin(currentMode, lat, lng);
            await calculatePin(pin);
            maybeFetchAreaAroundPin(pin);
        });
    </script>
</body>

</html>
